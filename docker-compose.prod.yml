name: kron

services:
  nginx:
    container_name: kron_nginx
    image: nginx:stable-alpine3.23-perl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - frontend
      - backend
  frontend:
    container_name: kron_frontend
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://kron.winnerx0.dev/api
        - VITE_POSTHOG_API_KEY=${VITE_POSTHOG_API_KEY}
        - VITE_POSTHOG_API_HOST=${VITE_POSTHOG_API_HOST}
    volumes:
      - frontend_dist:/app
    networks:
      - backend
  backend:
    container_name: kron_backend
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-kron}
      - KRON_ENCRYPTION_KEY=${KRON_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
  db:
    container_name: kron_db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-kron}
    volumes:
      - kron_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kron}"]
      interval: 10s
      timeout: 5s
      retries: 5
  certbot:
    container_name: kron_certbot
    image: certbot/certbot:latest
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - nginx_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - frontend
networks:
  frontend:
  backend:

volumes:
  kron_db:
  nginx_logs:
  nginx_certs:
    external: true
  certbot_www:
  frontend_dist:
